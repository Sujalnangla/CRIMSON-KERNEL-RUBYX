name: Crimson Ruby Kernel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Crimson build parser test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify build job
        run: |
          set -euxo pipefail
          echo "GitHub Actions build job is running"
          echo "Commit: $GITHUB_SHA"
          test -f Makefile
          test -f arch/arm64/configs/ruby_defconfig
