name: Crimson Ruby Kernel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Actions smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Actions runner
        run: |
          set -euxo pipefail
          echo "GitHub Actions is working"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF"
          test -f Makefile
          test -f arch/arm64/configs/ruby_defconfig
