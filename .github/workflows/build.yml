name: Crimson Ruby Kernel

on:
  push:
    branches:
      - ksu-susfs
  workflow_dispatch:

jobs:
  build:
    name: Build Crimson Ruby KSU/SUSFS
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git libelf-dev libfl-dev libncurses-dev libssl-dev lz4 python3 rsync unzip wget xz-utils zip zstd

      - name: Validate source
        run: |
          set -eux
          test -f Makefile
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/ruby_defconfig
          test -f localversion-cip
          test -f localversion-st
          test -f localversion-crimson
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f scripts/apply-susfs-vfs-integration.py
          test -f scripts/apply-ksu-manual-hooks.py

      - name: Integrate KernelSU-Next SUSFS
        run: |
          set -euxo pipefail
          rm -rf KernelSU-Next
          git clone -b susfs --depth=1 https://github.com/wodanesdag/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next remote set-head origin susfs
          test "$(git -C KernelSU-Next branch --show-current)" = susfs
          bash KernelSU-Next/kernel/setup.sh susfs
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          grep -q '^config KSU$' drivers/kernelsu/Kconfig
          grep -q '^config KSU_SUSFS$' drivers/kernelsu/Kconfig
          grep -q '^config KSU_MANUAL_HOOK$' drivers/kernelsu/Kconfig
          grep -q '^obj-$(CONFIG_KSU_SUSFS) += susfs\.o$' fs/Makefile
          python3 scripts/apply-susfs-vfs-integration.py
          python3 scripts/apply-susfs-avc-fix.py
          python3 scripts/apply-ksu-reboot-fix.py
          python3 scripts/apply-ksu-manual-hooks.py
          grep -q 'bool susfs_is_avc_log_spoofing_enabled = false;' security/selinux/avc.c
          grep -q 'if (unlikely(tsid == susfs_ksu_sid && susfs_is_avc_log_spoofing_enabled))' security/selinux/avc.c
          grep -q 'bypass_orig_flow:' security/selinux/avc.c

      - name: Fetch Clang r563880
        run: |
          set -euxo pipefail
          rm -rf clang clang-r563880.tar.gz
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/d2de056d8d8de40b2c1ccd39bfadf0c0318f5bad/clang-r563880.tar.gz" -o clang-r563880.tar.gz
          tar -xzf clang-r563880.tar.gz -C clang
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do test -x "clang/bin/$tool"; done
          clang/bin/clang --version | head -1

      - name: Configure
        run: |
          set -eux
          rm -rf out
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 ruby_defconfig
          ./scripts/config --file out/.config --enable KSU --enable KSU_SUSFS --enable KSU_MANUAL_HOOK --disable KPROBES
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' out/.config
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' out/.config
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> out/.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^# CONFIG_KPROBES is not set$' out/.config

      - name: Verify KSU/SUSFS hooks
        run: |
          set -eux
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_execveat_sucompat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -q 'susfs_is_inode_sus_path' fs/namei.c
          grep -q 'SUS_PATH' fs/namei.c
          grep -q 'susfs_is_inode_sus_path' fs/readdir.c
          grep -q 'susfs_generic_fillattr_spoofer' fs/stat.c
          grep -q 'susfs_open_redirect_spoof_do_sys_openat' fs/open.c
          grep -q 'susfs_spoof_uname' kernel/sys.c
          grep -q 'susfs_spoof_cmdline_or_bootconfig' fs/proc/cmdline.c
          grep -q 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS' kernel/kallsyms.c
          grep -q 'susfs_is_current_ksu_domain' fs/proc_namespace.c
          grep -q 'SUS_MOUNT' fs/statfs.c
          grep -q 'SUS_MAP' fs/proc/task_mmu.c
          python3 - <<'PY'
          from pathlib import Path
          s = Path('kernel/reboot.c').read_text()
          hook = s.index('if (magic1 == KSU_INSTALL_MAGIC1)')
          cap = s.index('if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))')
          assert hook < cap, 'KSU reboot hook is after CAP_SYS_BOOT check'
          print('KSU reboot supercall is intercepted before CAP_SYS_BOOT')
          PY

      - name: Build kernel
        run: |
          set -euxo pipefail
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LOCALVERSION="" KBUILD_BUILD_USER=Shu KBUILD_BUILD_HOST=Crimson-Ruby KCFLAGS="-Wno-error=implicit-function-declaration"

      - name: Verify output
        run: |
          set -eux
          release=$(make O=out ARCH=arm64 LOCALVERSION="" -s kernelrelease)
          echo "Built release: $release"
          test "$release" = "4.19.325-cip135-Crimson-ruby-st19"
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then cp out/arch/arm64/boot/Image.gz-dtb Image.gz; elif [ -f out/arch/arm64/boot/Image.gz ]; then cp out/arch/arm64/boot/Image.gz Image.gz; else exit 1; fi

      - name: Package AnyKernel3
        run: |
          set -eux
          git clone --depth=1 --branch eclipse-v2 https://github.com/rajdeep-3305/AnyKernel3 AnyKernel3
          cp Image.gz AnyKernel3/Image.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AnyKernel3/anykernel.sh')
          s = p.read_text()
          if 'kernel.string=Eclipse Kernel' not in s:
              raise SystemExit('Eclipse banner anchor missing')
          p.write_text(s.replace('kernel.string=Eclipse Kernel', 'kernel.string=Crimson Kernel - By Shu', 1))
          Path('AnyKernel3/banner').write_text('CRIMSON KERNEL\nBY SHU\nCrimson Ruby | MediaTek MT6877\n')
          PY
          grep -q '^kernel.string=Crimson Kernel - By Shu$' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Crimson-ruby-${GITHUB_RUN_NUMBER}.zip" . -x '.git/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-ruby-${{ github.run_number }}
          path: |
            Image.gz
            Crimson-ruby-*.zip
          if-no-files-found: error
