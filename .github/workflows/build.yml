name: Build Crimson Ruby Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  ARCH: arm64
  OUT_DIR: ${{ github.workspace }}/out
  KERNEL_DEFCONFIG: ruby_defconfig
  TOOLCHAIN_REPO: https://gitlab.com/wodanesdag/android_prebuilts_clang_host_linux-x86_clang-r563880
  TOOLCHAIN_BRANCH: master
  TOOLCHAIN_DIR: clang
  ANYKERNEL_REPO: https://github.com/rajdeep-3305/AnyKernel3
  ANYKERNEL_BRANCH: eclipse-v2

jobs:
  build:
    name: Build Ruby kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi git libelf-dev libfl-dev libncurses-dev libssl-dev \
            lld llvm python3 rsync unzip zip

      - name: Configure ccache
        run: |
          ccache --set-config=compression=false
          ccache --set-config=max_size=5G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: crimson-ruby-ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/ruby_defconfig', 'Makefile', 'localversion-*') }}
          restore-keys: |
            crimson-ruby-ccache-${{ runner.os }}-

      - name: Clone Android clang r563880
        run: |
          git clone --depth=1 --branch "$TOOLCHAIN_BRANCH" "$TOOLCHAIN_REPO" "$TOOLCHAIN_DIR"
          echo "$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Record source and toolchain
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Branch/ref: $GITHUB_REF"
            echo "Dirty tree: $(test -n "$(git status --porcelain)" && echo yes || echo no)"
            echo "Kernel localversion files:"
            cat localversion-cip localversion-st 2>/dev/null || true
            echo "Clang:"
            clang --version
            echo "LLD:"
            ld.lld --version
          } | tee build-info.txt

      - name: Apply kernel configuration
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" "$KERNEL_DEFCONFIG"
          cp "$OUT_DIR/.config" config-after-defconfig.txt

      - name: Build kernel
        run: |
          make -j"$(nproc)" O="$OUT_DIR" \
            ARCH="$ARCH" \
            CC="ccache clang" \
            LLVM=1 LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin/arm-linux-gnueabi-"

      - name: Verify kernel output
        run: |
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          else
            echo "No Image.gz-dtb or Image.gz produced"
            exit 1
          fi
          echo "Kernel image: $IMAGE"
          sha256sum "$IMAGE"
          strings "$OUT_DIR/arch/arm64/boot/Image" | grep -m1 '^Linux version ' || true
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO)=' "$OUT_DIR/.config" || true

      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 --branch "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" AnyKernel3
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/Image.gz
          else
            cp -f "$OUT_DIR/arch/arm64/boot/Image.gz" AnyKernel3/Image.gz
          fi
          if [ -f "$OUT_DIR/arch/arm64/boot/dtbo.img" ]; then
            cp -f "$OUT_DIR/arch/arm64/boot/dtbo.img" AnyKernel3/dtbo.img
          elif [ -f "$OUT_DIR/arch/arm64/boot/dtbo" ]; then
            cp -f "$OUT_DIR/arch/arm64/boot/dtbo" AnyKernel3/dtbo
          fi
          cp build-info.txt config-after-defconfig.txt AnyKernel3/
          cd AnyKernel3
          zip -q -r ../Crimson-Ruby-AnyKernel3.zip .
          cd ..
          cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" Crimson-Ruby-Image.gz-dtb 2>/dev/null || \
            cp "$OUT_DIR/arch/arm64/boot/Image.gz" Crimson-Ruby-Image.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crimson-ruby-build-${{ github.sha }}
          path: |
            Crimson-Ruby-AnyKernel3.zip
            Crimson-Ruby-Image.gz-dtb
            Crimson-Ruby-Image.gz
            build-info.txt
            config-after-defconfig.txt
          if-no-files-found: error
          retention-days: 14
