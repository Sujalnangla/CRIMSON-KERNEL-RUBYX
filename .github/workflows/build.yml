name: Crimson Ruby Kernel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Crimson build source validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify build job
        run: |
          set -euxo pipefail
          echo "GitHub Actions build job is running"
          echo "Commit: $GITHUB_SHA"
          test -f Makefile
          test -f arch/arm64/configs/ruby_defconfig

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libfl-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Verify dependencies
        run: |
          set -euxo pipefail
          command -v make
          command -v bc
          command -v bison
          command -v flex
          command -v ccache
          command -v python3
          command -v rsync
          command -v unzip
          command -v zip
          command -v zstd
          echo "Build dependencies are ready"

      - name: Validate KernelSU and SUSFS source
        run: |
          set -euxo pipefail

          test -d KernelSU-Next
          test -e drivers/kernelsu
          test -f KernelSU-Next/kernel/Makefile
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' arch/arm64/configs/ruby_defconfig

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' arch/arm64/configs/ruby_defconfig; then
            echo 'ERROR: KSU kprobes hook must remain disabled for manual-hook configuration'
            exit 1
          fi

          grep -q '^# CONFIG_MTK_FPSGO is not set$' arch/arm64/configs/ruby_defconfig
          grep -q '^CONFIG_TCP_CONG_BBR3=y$' arch/arm64/configs/ruby_defconfig

          echo 'KernelSU/SUSFS source and defconfig validation passed'
