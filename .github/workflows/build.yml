name: Crimson Kernel CI

on:
  push:
    branches:
      - ksu-susfs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runner test
        run: |
          echo "Crimson CI runner is working"
          echo "Commit: $GITHUB_SHA"
          test -f Makefile
          test -f arch/arm64/configs/ruby_defconfig
