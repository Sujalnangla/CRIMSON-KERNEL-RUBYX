name: Build Crimson Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  OUT_DIR: ${{ github.workspace }}/out
  KERNEL_REPO: https://github.com/rajdeep-3305/kernel_xiaomi_mt6877.git
  KERNEL_REF: 569bc23c41974d3506000e9851c1ca37aca33884
  KERNEL_DEFCONFIG: ruby_defconfig
  ARCH: arm64
  TOOLCHAIN_REPO: https://gitlab.com/wodanesdag/android_prebuilts_clang_host_linux-x86_clang-r563880
  TOOLCHAIN_BRANCH: master
  TOOLCHAIN_DIR: clang
  ANYKERNEL_REPO: https://github.com/rajdeep-3305/AnyKernel3
  ANYKERNEL_BRANCH: eclipse-v2
  EXPECTED_KERNEL_RELEASE: 4.19.325-cip135-st19-Crimson-ruby

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Crimson kernel tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libelf-dev \
            libssl-dev lz4 python3 rsync unzip wget xz-utils zstd

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Prepare existing kernel tree
        run: |
          test -f kernel/Makefile
          test -f kernel/arch/arm64/Makefile
          test -f kernel/arch/arm64/configs/$KERNEL_DEFCONFIG
          printf '%s\n' '-Crimson-ruby' > kernel/localversion-crimson
          echo "Using checked-in Crimson kernel tree"
          echo "Target upstream source revision: $KERNEL_REF"

      - name: Fetch Android Clang r563880
        run: |
          git clone --depth=1 --branch "$TOOLCHAIN_BRANCH" "$TOOLCHAIN_REPO" "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/clang"

      - name: Record build source
        run: |
          {
            echo "Crimson repository: $GITHUB_REPOSITORY"
            echo "Crimson commit: $GITHUB_SHA"
            echo "Checked-in kernel tree: kernel/"
            echo "Target upstream source: $KERNEL_REPO@$KERNEL_REF"
            echo "Toolchain: $TOOLCHAIN_REPO@$TOOLCHAIN_BRANCH"
            echo "Expected release: $EXPECTED_KERNEL_RELEASE"
          } | tee "$GITHUB_WORKSPACE/build-source.txt"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p "$OUT_DIR"
          make O="$OUT_DIR" ARCH="$ARCH" "$KERNEL_DEFCONFIG"

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin:$PATH"
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" \
            CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld \
            CROSS_COMPILE="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin/arm-linux-androideabi-" \
            KCFLAGS="-Wno-error=implicit-function-declaration"

      - name: Verify kernel identity
        working-directory: kernel
        run: |
          release=$(make O="$OUT_DIR" ARCH="$ARCH" -s kernelrelease)
          echo "Built kernel release: $release"
          test "$release" = "$EXPECTED_KERNEL_RELEASE"
          test -f "$OUT_DIR/arch/arm64/boot/Image.gz"
          cp "$OUT_DIR/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/Image.gz"
          if [ -f "$OUT_DIR/arch/arm64/boot/dts/mediatek/mt6877.dtb" ]; then
            cat "$OUT_DIR/arch/arm64/boot/dts/mediatek/mt6877.dtb" >> "$GITHUB_WORKSPACE/Image.gz"
          fi

      - name: Package AnyKernel3
        run: |
          rm -rf AnyKernel3
          git clone --depth=1 --branch "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" AnyKernel3
          cp Image.gz AnyKernel3/Image.gz
          cp build-source.txt AnyKernel3/build-source.txt
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Crimson-ruby-${GITHUB_RUN_NUMBER}.zip" . -x '.git/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-ruby-${{ github.run_number }}
          path: |
            Image.gz
            build-source.txt
            Crimson-ruby-*.zip
