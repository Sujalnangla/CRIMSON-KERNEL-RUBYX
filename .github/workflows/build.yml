name: "Build Kernel"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  push:
    branches:
      - 'ksu-susfs'
      - 'main'
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse configs.json"
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v4

      - name: "😆 Generate Matrix"
        id: generate-matrix
        run: |
          shopt -s nullglob
          files=(.github/configs/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No JSON config files found in .github/configs/"
            exit 1
          fi
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          jq -s '[.[][]]' "${files[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "⏰ Set builddate"
        id: generate-builddate
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-24.04
    needs:
      - Set-repos
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      WORKSPACE: ${{ github.workspace }}
      builddate: "${{ needs.Set-repos.outputs.builddate }}"
      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}
      withKernelSU: ${{ matrix.repos.withKernelSU }}
      withSuSFS: ${{ matrix.repos.withSuSFS }}
      ccache: ${{ matrix.repos.ccache }}
      useAnykernel: ${{ matrix.repos.AnyKernel3.use }}
      release: ${{ matrix.repos.AnyKernel3.release }}

    steps:
      - name: "⭐ Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev \
            curl git ftp lftp wget libarchive-tools ccache jq zip unzip tar gzip bzip2 rar unrar \
            checkinstall libncursesw5-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev python3 python-is-python3 python3-pip

      - name: "🚄 Create cache key from `repos`"
        if: ${{ env.ccache == 'true' }}
        id: ccache_key
        run: |
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CACHE_KEY=$(echo -n '${{ toJSON(matrix.repos) }}' | base64 -w 0 | cut -c -48)" >> $GITHUB_OUTPUT

      - name: "🚅 Cache ccache files"
        if: ${{ env.ccache == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-

      - name: "⏰ Setup Anykernel3"
        if: ${{ env.useAnykernel == 'true' }}
        env:
          params: "${{ toJSON(matrix.repos.AnyKernel3) }}"
        run: |
          ANYKERNEL_REPO=$(echo '$params' | jq -r ".repo")
          ANYKERNEL_BRANCH=$(echo '$params' | jq -r ".branch")
          git clone --recursive --depth=1 -j $(nproc) --branch $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3

      - name: "🌟 Clone kernel source"
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME
          echo "Kernel HEAD: $(git -C $KERNEL_NAME rev-parse --short HEAD)"

      - name: "💫 Get toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo '$toolchains' | jq 'length')"
          for ((i=0;i<toolchains_num;i++)); do
            toolchain_name=$(echo '$toolchains' | jq -r ".[$i].name")
            toolchain_repo=$(echo '$toolchains' | jq -r ".[$i].repo")
            toolchain_branch=$(echo '$toolchains' | jq -r ".[$i].branch")
            toolchain_url=$(echo '$toolchains' | jq -r ".[$i].url")

            if [ -z "${toolchain_url:-}" ] || [ "$toolchain_url" = "null" ]; then
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name
            else
              wget -q "$toolchain_url"
              filename="${toolchain_url##*/}"
              mkdir -p $toolchain_name
              case "$filename" in
                *.zip) unzip -q -d $toolchain_name "$filename" ;;
                *.tar.gz|*.tgz) tar -zxvf "$filename" -C $toolchain_name ;;
                *.tar) tar -xvf "$filename" -C $toolchain_name ;;
                *) echo "Unknown archive format: $filename" ;;
              esac
            fi

            jq -r ".[$i].binPath[] | tostring" <<< "$toolchains" | while read -r bin_path; do
              echo "$WORKSPACE/$toolchain_name/$bin_path" >> $GITHUB_PATH
            done
          done

      - name: "😎 Set args"
        id: generate-args
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
        run: |
          ARCH=$(echo '$params' | jq -r ".ARCH // empty")
          CC=$(echo '$params' | jq -r ".CC // empty")

          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p ${{ env.OUT_DIR }} && args="$args O=${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="$args ARCH=$ARCH"
          fi
          if [ -n "$CC" ]; then
            [[ "$CC" == *"/"* ]] && CC="${{ env.WORKSPACE }}/$CC"
            [ "${{ env.ccache }}" = "true" ] && CC="ccache $CC"
            args="$args CC=$CC"
          fi

          while read -r key value; do
            [[ "$value" == *"/"* ]] && value="${{ env.WORKSPACE }}/$value"
            args="$args $key=$value"
          done < <(jq -r '.externalCommand // {} | to_entries[] | "\(.key) \(.value)"' <<< "$params")

          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "😋 Integrate KernelSU Next"
        id: integrate-kernelsu-next
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withKernelSU == 'true' && env.withSuSFS == 'true' }}
        run: |
          echo "" > .scmversion
          git clone -b susfs https://github.com/wodanesdag/KernelSU-Next.git
          bash KernelSU-Next/kernel/setup.sh susfs
          
          KSU_VER=$(cd KernelSU-Next && expr $(git rev-list --count HEAD) + 30200)
          echo "KERNELSU_NEXT_VERSION=v${KSU_VER}" >> $GITHUB_OUTPUT

      - name: "👍 Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "🎶 Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: make ${{ env.args }}

      - name: "❤️ Pack AnyKernel3.zip"
        if: ${{ env.useAnykernel == 'true' }}
        id: pack-anykernel
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          ksu_ver: ${{ steps.integrate-kernelsu-next.outputs.KERNELSU_NEXT_VERSION }}
        run: |
          BUILD_TAG="${{ env.KERNEL_DEVICE }}${ksu_ver:+-${ksu_ver}}-${{ env.builddate }}"
          ZIP_NAME="${BUILD_TAG}.zip"

          if [ -f "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz-dtb" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz-dtb ./AnyKernel3/Image.gz
          elif [ -f "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz ./AnyKernel3/Image.gz
          elif [ -f "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image ./AnyKernel3/Image
          fi

          if [ -f "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img ./AnyKernel3/
          elif [ -f "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo ./AnyKernel3/
          fi

          cd AnyKernel3
          zip -q -r "../${ZIP_NAME}" *
          echo "ZIP_PATH=${WORKSPACE}/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: "💾 Upload AnyKernel3 image"
        uses: actions/upload-artifact@v4
        if: ${{ env.useAnykernel == 'true' }}
        with:
          name: ${{ steps.pack-anykernel.outputs.ZIP_NAME }}
          path: ${{ steps.pack-anykernel.outputs.ZIP_PATH }}
