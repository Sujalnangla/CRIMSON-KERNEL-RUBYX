name: Build Crimson Ruby Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            liblz4-tool \
            libxml2-utils \
            xsltproc \
            cpio \
            kmod \
            python3 \
            rsync \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
       - name: Install Clang/LLVM 14
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-14 \
            lld-14 \
            llvm-14 \
            llvm-14-tools

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM toolchain
        run: |
          echo "===== TOOL PATHS ====="
          command -v clang
          command -v clang-14
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objdump
          command -v llvm-objcopy
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-size
          command -v llvm-strings

          echo
          echo "===== REAL PATHS ====="
          readlink -f "$(command -v clang)"
          readlink -f "$(command -v ld.lld)"
          readlink -f "$(command -v llvm-ar)"
          readlink -f "$(command -v llvm-nm)"
          readlink -f "$(command -v llvm-objdump)"

          echo
          echo "===== VERSIONS ====="
          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objdump --version
          llvm-objcopy --version
          llvm-strip --version
          llvm-readelf --version
          llvm-size --version
          llvm-strings --version
      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ruby_defconfig

      - name: Verify defconfig
        run: |
          test -f out/.config || (echo "FAIL: out/.config not generated" && exit 1)
          grep -q 'CONFIG_KSU=y' out/.config || (echo "FAIL: CONFIG_KSU not in out/.config" && exit 1)
          grep -q 'CONFIG_KSU_MANUAL_HOOK=y' out/.config || (echo "FAIL: CONFIG_KSU_MANUAL_HOOK not in out/.config" && exit 1)

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Verify artifacts
        run: |
          echo "===== ARTIFACT VERIFICATION ====="
          for f in \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/dts/mediatek/mt6877.dtb \
            out/arch/arm64/boot/dts/mediatek/ruby.dtbo
          do
            if [ -f "$f" ]; then
              echo "PRESENT: $f"
              ls -lh "$f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

          echo
          echo "===== ARTIFACT HASHES ====="
          sha256sum \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/dts/mediatek/mt6877.dtb \
            out/arch/arm64/boot/dts/mediatek/ruby.dtbo

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crimson-ruby-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/mediatek/mt6877.dtb
            out/arch/arm64/boot/dts/mediatek/ruby.dtbo
      - name: Verify source integrity
        run: |
          git status --short
          git diff --exit-code -- ':!out/'
