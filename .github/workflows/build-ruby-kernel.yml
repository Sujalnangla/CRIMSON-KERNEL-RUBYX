```yaml
name: Build Ruby Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    name: Build Ruby Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show kernel Git state
        run: |
          echo "===== PARENT KERNEL ====="
          git rev-parse HEAD
          git status --short

      - name: Clone KernelSU-Next
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout 9dd15c875c82

      - name: Apply KernelSU symlink
        run: |
          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

      - name: Verify KernelSU state
        run: |
          echo "===== KERNELSU-NEXT ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next status --short

          echo
          echo "===== KSU SYMLINK ====="
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget

      - name: Generate kernel configuration
        run: |
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            ruby_defconfig

      - name: Verify kernel configuration
        run: |
          echo "===== KERNEL CONFIG ====="

          grep -n -E \
            '^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|^CONFIG_KSU_SUSFS=|^CONFIG_SECURITY_SELINUX=' \
            out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            -j2 \
            2>&1 | tee build.log

      - name: Verify build output
        run: |
          echo "===== BUILD OUTPUT ====="

          test -f out/vmlinux
          test -f out/arch/arm64/boot/Image

          ls -lh \
            out/vmlinux \
            out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruby-kernel
          path: |
            out/vmlinux
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            build.log
```
