name: Build Ruby Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout KernelSU-Next
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout 9dd15c875c82

      - name: Link KernelSU
        run: |
          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget

      - name: Verify Git state
        run: |
          echo "===== PARENT KERNEL ====="
          git rev-parse HEAD

          echo "===== KERNELSU-NEXT ====="
          git -C KernelSU-Next rev-parse HEAD

          echo "===== CONFIG ====="
          grep -n -E \
            '^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|^CONFIG_KSU_SUSFS=|^CONFIG_SECURITY_SELINUX=' \
            out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            -j2 \
            2>&1 | tee build.log

      - name: Verify build
        run: |
          test -f out/vmlinux
          test -f out/arch/arm64/boot/Image

          echo "===== BUILD ARTIFACTS ====="
          ls -lh \
            out/vmlinux \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruby-kernel
          path: |
            out/vmlinux
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            build.log
